<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CHERNOBYL</title>
	<link rel="icon" href="data:image/svg+xml,
	<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
		<rect width='100' height='100' rx='18' fill='%23FFD600'/>
		<text x='50' y='78' text-anchor='middle' font-size='88'>☢</text>
	</svg>">
    <style>
		body { 
            background-color: #111; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;

            /* FIX 1: Force a absolute full-screen grid base layout */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;

            /* FIX 2: Absolute center all child components on the screen */
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas { 
            background-color: #1a1a1a; 
            display: block; 
        }

        /* 🔄 SELF-CENTERING MOBILE ROTATION ENGINE */
        body.rotated-game {
            /* Keep body dimensions locked to the true screen dimensions */
            width: 100vw !important;
            height: 100vh !important;
            width: 100dvw !important;
            height: 100dvh !important;
        }
        
        body.rotated-game #canvas-container {
            /* Rotate the internal canvas wrapper panel instead of stretching the main body element */
            transform: rotate(90deg);
            transform-origin: center center;

            /* FIX 3: Invert the layout sizes explicitly here so the container dimensions match the canvas */
            width: 100vh !important; 
            height: 100vw !important;
            width: 100dvh !important;
            height: 100dvw !important;
        }

        body.rotated-game canvas {
            /* Lock canvas dimensions inside the flipped wrapper bounds */
            width: 100dvh !important;
            height: 100dvw !important;
        }
    </style>
</head>
<body>
	
	<div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100dvw; height: 100dvh; background: #111; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif;">
        <h1 style="color: #ffcc00; font-size: 2rem; margin-bottom: 20px; letter-spacing: 2px;">ESCAPE CHERNOBYL</h1>
        <button id="start-btn" style="background: #ffcc00; color: #000; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; cursor: pointer;">START</button>
    </div>
    
	<!-- Add this container box to hold the canvas cleanly -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
	<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamically resize canvas to fill the screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
		
		// FIX 1: Make targetSize global so all resizing functions can read it
        // FIX 1: Detect if user is on mobile. Shrink tiles to 24px so mobile fits a dense, complex maze!
        const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const TARGET_SIZE = IS_MOBILE ? 24 : 45; 
		
        let colsCalculated = Math.floor(canvas.width / TARGET_SIZE);
        let rowsCalculated = Math.floor(canvas.height / TARGET_SIZE);
        
        // Force odd numbers so the maze generation works perfectly
        let COLS = colsCalculated % 2 === 0 ? colsCalculated - 1 : colsCalculated;
        let ROWS = rowsCalculated % 2 === 0 ? rowsCalculated - 1 : rowsCalculated;
        
        let TILE_WIDTH = canvas.width / COLS;
        let TILE_HEIGHT = canvas.height / ROWS;
		
		let map = [];
        let keys = {};
        let torchBattery = 100; 
        let isGameOver = false;
		
		// 1. SELECT ELEMENT NODES
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');

		// Chernobyl radiation audio synthesis states
        let audioCtx = null;
        let lastClickTime = 0;

        // 2. FULLSCREEN AND ORIENTATION LOCK MANAGEMENT ROUTINE
		async function activateFullscreenLandscape() {
			// FIX: Initialize the Audio Context right on user interaction
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            try {
                // FIX: Request Fullscreen on the document root element instead of the canvas.
                // This allows the canvas to recalculate its width and height and fill 100% of the screen.
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* iOS Safari fallback */
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch (error) {
                console.log("Fullscreen system skipped:", error);
            }
			
			// FIX: If user is on a vertical screen panel, apply the rotation class right now
            if (window.innerHeight > window.innerWidth) {
                document.body.classList.add('rotated-game');
            }
			
            // Hide menu window and update dimensions
            startOverlay.style.display = 'none';
            handleResizeEvent();
        }

        // Bind the fullscreen activation function to the click/touch event
        startBtn.addEventListener('click', activateFullscreenLandscape);
        startBtn.addEventListener('touchstart', activateFullscreenLandscape);
		
		// Helper routine that safely resizes map dimensions over the air on rotation changes
		function handleResizeEvent() {
            // FIX: Safely detect portrait mode orientation layout rules
            let width = window.innerWidth;
            let height = window.innerHeight;
            let isPortrait = height > width;

            if (isPortrait) {
                document.body.classList.add('rotated-game');
                canvas.width = height;  // Swap dimensions to prevent squishing
                canvas.height = width;
            } else {
                document.body.classList.remove('rotated-game');
                canvas.width = width;
                canvas.height = height;
            }					

            // FIX 2: Recalculate column and row allocations using global TARGET_SIZE
            let colsCalculated = Math.floor(canvas.width / TARGET_SIZE);
            let rowsCalculated = Math.floor(canvas.height / TARGET_SIZE);
            
            // Re-apply odd constraint parameters
            COLS = colsCalculated % 2 === 0 ? colsCalculated - 1 : colsCalculated;
            ROWS = rowsCalculated % 2 === 0 ? rowsCalculated - 1 : rowsCalculated;

            // FIX 3: Instantly update tile pixel scalars so everything fills the screen perfectly
            TILE_WIDTH = canvas.width / COLS;
            TILE_HEIGHT = canvas.height / ROWS;

            // Regenerate a fresh, matching maze layout matrix container
            resetGameEngine(); 
        }

        // Catch orientation rotation updates instantly on mobile devices
        window.addEventListener('resize', handleResizeEvent);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResizeEvent, 200); // 200ms delay gives phone buffer time to complete rotation
        });	                       
        
        // Mobile virtual joystick trackers
        let touchStart = null;  // Stores original coordinates where thumb touched down
        let touchMove = null;   // Stores live coordinates where thumb is currently dragging

        // Chernobyl radiation/unstable power variables
        let blackoutTimer = 0;      // Tracks how many frames of total darkness are left
        let nextBlackoutRoll = 0;   // Cooldown tracker to prevent non-stop back-to-back blackouts			

        // Initialize map filled with solid walls (1s)
        for (let r = 0; r < ROWS; r++) {
            map[r] = [];
            for (let c = 0; c < COLS; c++) {
                map[r][c] = 1; 
            }
        }

        // 2. PROCEDURAL MAZE GENERATOR
        function generateRandomMaze() {
            let stack = [];
            let current = { r: 1, c: 1 };
            map[current.r][current.c] = 0;

            while (true) {
                let neighbors = [];
                let r = current.r;
                let c = current.c;

                if (r > 1 && map[r - 2][c] === 1) neighbors.push({ r: r - 2, c: c, wallR: r - 1, wallC: c });
                if (r < ROWS - 2 && map[r + 2][c] === 1) neighbors.push({ r: r + 2, c: c, wallR: r + 1, wallC: c });
                if (c > 1 && map[r][c - 2] === 1) neighbors.push({ r: r, c: c - 2, wallR: r, wallC: c - 1 });
                if (c < COLS - 2 && map[r][c + 2] === 1) neighbors.push({ r: r, c: c + 2, wallR: r, wallC: c + 1 });

                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    map[next.wallR][next.wallC] = 0;
                    map[next.r][next.c] = 0;
                    stack.push(current);
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break; 
                }
            }

            // Explicitly unlock start and bottom-right exit positions
            map[1][1] = 0;
            map[ROWS - 2][COLS - 2] = 0;
        }

        generateRandomMaze();

        // 3. SET DYNAMIC PLAYER POSITION (Centered in cell 1,1)
        let player = { 
            x: TILE_WIDTH * 1.5, 
            y: TILE_HEIGHT * 1.5, 
            speed: 4 
        };

		// Key Listeners (Forces lowercase string conversion for easy lookup matching)
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

		// Mobile Touch Listeners
        window.addEventListener('touchstart', e => {
            // FIX: If the game is ended, tapping anywhere on a touch device triggers an instant map reset
            if (isGameOver || torchBattery <= 0) {
                resetGameEngine();
                return;
            }
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            touchMove = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (!touchStart) return;
            // Update active dragging coordinates
            touchMove = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: false });

        window.addEventListener('touchend', e => {
            // Clear calculations when thumb lifts off the glass panel
            touchStart = null;
            touchMove = null;
        });
		
		// Synthesizes a true, high-distortion white noise radiation crackle
		function playGeigerClick() {
            if (!audioCtx || audioCtx.state === 'suspended') return;

            let now = audioCtx.currentTime;

            // --- LAYER 1: RAW WHITE NOISE SNAP ---
            let bufferSize = audioCtx.sampleRate * 0.015;
            let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; // Pure static distortion values
            }
            let noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            let noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(1400 + Math.random() * 1000, now);
            noiseFilter.Q.setValueAtTime(5.0, now); // Higher Q pins a sharper, nastier crunch

            let noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.45, now); // Strong static burst volume
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.012);

            noiseNode.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            // --- LAYER 2: AGGRESSIVE SAWTOOTH RUMBLE (Speaker Blowout) ---
            let lowOsc = audioCtx.createOscillator();
            lowOsc.type = 'sawtooth';
            lowOsc.frequency.setValueAtTime(500 + Math.random() * 300, now);
            lowOsc.frequency.exponentialRampToValueAtTime(30, now + 0.015); // Violent pitch dive

            let lowGain = audioCtx.createGain();
            lowGain.gain.setValueAtTime(0.30, now);
            lowGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.015);

            lowOsc.connect(lowGain);
            lowGain.connect(audioCtx.destination);

            // --- LAYER 3: TUBE METALLIC RING (High-Frequency Feedback) ---
            let highOsc = audioCtx.createOscillator();
            highOsc.type = 'sine';
            highOsc.frequency.setValueAtTime(2800 + Math.random() * 600, now); // Shrill resonance

            let highGain = audioCtx.createGain();
            highGain.gain.setValueAtTime(0.10, now); // Subtle high metallic ring
            highGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.008);

            highOsc.connect(highGain);
            highGain.connect(audioCtx.destination);

			// --- LAYER 4: SPEAKER FUZZ (Fills out the midrange grid distortion) ---
            let fuzzOsc = audioCtx.createOscillator();
            fuzzOsc.type = 'triangle';
            fuzzOsc.frequency.setValueAtTime(180, now);
            fuzzOsc.frequency.linearRampToValueAtTime(450, now + 0.014);

            let fuzzGain = audioCtx.createGain();
            fuzzGain.gain.setValueAtTime(0.20, now);
            fuzzGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.014);

            fuzzOsc.connect(fuzzGain);
            fuzzGain.connect(audioCtx.destination);

            // --- TRIGGER ALL LAYERS SIMULTANEOUSLY ---
            noiseNode.start(now);
            noiseNode.stop(now + 0.015);

            lowOsc.start(now);
            lowOsc.stop(now + 0.015);

            highOsc.start(now);
            highOsc.stop(now + 0.015);
			
			fuzzOsc.start(now);   
			fuzzOsc.stop(now + 0.014);
        }

		function update() {
            let moveX = 0;
            let moveY = 0;

            // FIX: Smooth Analog Vector Steering for Touch Screens
            if (touchStart && touchMove) {
				// FIX: ONLY clear and overwrite the movement keys if a mobile touch dragging gesture is actively happening!
                keys['arrowup'] = keys['arrowdown'] = keys['arrowleft'] = keys['arrowright'] = false;
				
				// FIX: Check if the device is physically vertical (meaning the CSS engine is actively rotating it)
                let isPageRotated = document.body.classList.contains('rotated-game');
                
                let dx, dy;
                if (isPageRotated) {
                    // Invert the touchscreen axes vectors to follow the 90-degree CSS layout flip
                    dx = touchMove.y - touchStart.y;
                    dy = -(touchMove.x - touchStart.x);
                } else {
                    // Standard native horizontal tracking
                    dx = touchMove.x - touchStart.x;
                    dy = touchMove.y - touchStart.y;
                }
				
                let distance = Math.sqrt(dx * dx + dy * dy);
                let deadzone = 8; // Ignores tiny finger micro-shakes

                if (distance > deadzone) {
                    // Calculate the exact 360-degree angle of the thumb slide
                    let angle = Math.atan2(dy, dx);
                    
                    // Convert the angle into smooth fractional movement speeds (between -1 and 1)
                    moveX = Math.cos(angle);
                    moveY = Math.sin(angle);
					
					// FIX 2: Map the mobile joystick directions to lowercase keys as well
                    if (moveY < -0.3) keys['arrowup'] = true;
                    if (moveY > 0.3) keys['arrowdown'] = true;
                    if (moveX < -0.3) keys['arrowleft'] = true;
                    if (moveX > 0.3) keys['arrowright'] = true;
                }
            } else {
                // Standard desktop keyboard input fallback
                if (keys['arrowup'] || keys['w']) moveY = -1;
                if (keys['arrowdown'] || keys['s']) moveY = 1;
                if (keys['arrowleft'] || keys['a']) moveX = -1;
                if (keys['arrowright'] || keys['d']) moveX = 1;

                // Normalize keyboard diagonals so you don't run faster when pressing two keys at once
                if (moveX !== 0 && moveY !== 0) {
                    moveX *= 0.7071;
                    moveY *= 0.7071;
                }
            }
			
			// FIX 1: Pass the raw speed vectors to the module to automatically track player heading angles
            TorchDirectionModule.updateDirection(moveX, moveY);

            // Apply movement direction directly to the player's core speed parameter
            let nextX = player.x + (moveX * player.speed);
            let nextY = player.y + (moveY * player.speed);
            let radius = 12;            

            function isWall(x, y) {
                let cellX = Math.floor(x / TILE_WIDTH);
                let cellY = Math.floor(y / TILE_HEIGHT);
                if (cellY < 0 || cellY >= ROWS || cellX < 0 || cellX >= COLS) return true;
                return map[cellY][cellX] === 1;
            }

            // Box collision check on corners to avoid getting stuck
            let canMoveX = !isWall(nextX - radius, player.y - radius + 2) && 
                           !isWall(nextX - radius, player.y + radius - 2) &&
                           !isWall(nextX + radius, player.y - radius + 2) && 
                           !isWall(nextX + radius, player.y + radius - 2);

            let canMoveY = !isWall(player.x - radius + 2, nextY - radius) && 
                           !isWall(player.x + radius - 2, nextY - radius) &&
                           !isWall(player.x - radius + 2, nextY + radius) && 
                           !isWall(player.x + radius - 2, nextY + radius);

            if (canMoveX) player.x = nextX;
            if (canMoveY) player.y = nextY;

            // Battery continuous depletion logic
            if (!isGameOver && torchBattery > 0) {
                torchBattery -= 0.03; 
                if (torchBattery < 0) torchBattery = 0;
            }
			
			// Chernobyl unstable power management logic
            if (blackoutTimer > 0) {
                blackoutTimer--; // Count down the active blackout frames
            } else if (!isGameOver && torchBattery < 50) {
                // If not in a blackout, decrement the safety cooldown clock
                if (nextBlackoutRoll > 0) nextBlackoutRoll--;

                // Roll a 0.15% random chance each frame to cause a blackout (if safety cooldown is over)
                if (nextBlackoutRoll === 0 && Math.random() < 0.0015) {
                    // 60 frames = ~1 second. Randomly select an outage duration between 1 to 2 seconds.
                    blackoutTimer = Math.floor(60 + Math.random() * 60);
                    nextBlackoutRoll = 300; // Force a 5-second safety grace window before the torch can short out again
					
					// Trigger a massive screen rumble the exact millisecond a radiation outage hits
                    ScreenShakeModule.trigger(22);
                }
            }
			
			// 3. ADAPTIVE RADIATION AUDIO TIMING LOOP
            if (!isGameOver && audioCtx) {
                let currentTime = performance.now();
                
                // Calculate an instability multiplier (100% battery = 1, 10% battery = 10)
                let radiationIntensity = (100 - torchBattery) / 10 + 1;

                // Establish base click delays. Base background crackle is wide, low-battery crackle is rapid.
                // FIX 1: Drop the base delay to 45ms so sounds overlap and distort immediately at startup
				let baseDelay = 45 - (radiationIntensity * 3); 
                let randomBuffer = Math.random() * (90 / radiationIntensity);
                let currentTargetDelay = Math.max(6, baseDelay + randomBuffer);

                // If a temporary radiation blackout is active, forcefully double the crackle speed
                if (blackoutTimer > 0) {
                    currentTargetDelay *= 0.25;
                }

                // Fire the sound node if the calculation delay window has elapsed
                if (currentTime - lastClickTime > currentTargetDelay) {
                    playGeigerClick();
                    lastClickTime = currentTime;
                }
            }
			
			// 1. CHECK WIN CONDITION (Did player step on the green tile?)
            let playerCellX = Math.floor(player.x / TILE_WIDTH);
            let playerCellY = Math.floor(player.y / TILE_HEIGHT);
            if (!isGameOver && playerCellX === COLS - 2 && playerCellY === ROWS - 2) {
                isGameOver = true;
            }

            // 2. KEYBOARD RESTART TRIGGERS
            if ((isGameOver || torchBattery <= 0) && keys['r']) {
                resetGameEngine();
            }
			
			// Hook into the standalone battery collision monitoring routine
            BatteryModule.checkCollisions();
			
			// Run the floating fog background movement simulation frame step
            FogParticleModule.updateAll();

        }

        function draw() {
			// FIX 2: Apply the screen displacement vectors BEFORE clearing or drawing pixels
            ScreenShakeModule.preRender();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Exit Square
            ctx.fillStyle = '#00ff66';
            let exitX = (COLS - 2) * TILE_WIDTH;
            let exitY = (ROWS - 2) * TILE_HEIGHT;
			TextureModule.drawTile('exit', exitX, exitY, TILE_WIDTH, TILE_HEIGHT);
			
			// 2. DRAW TEXTURED INDUSTRIAL BLOCK WALLS
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (map[r][c] === 1) {
                        let tx = c * TILE_WIDTH;
                        let ty = r * TILE_HEIGHT;
                        let tw = Math.ceil(TILE_WIDTH);
                        let th = Math.ceil(TILE_HEIGHT);
                        
                        // Pass coordinates directly to the textured pattern module
                        TextureModule.drawTile('wall', tx, ty, tw, th);
                    }
                }
            }

			// Calculate baseline torch circle size
            let baseRadius = (torchBattery / 100) * 210;

			// INTENSIFY FLICKERING GRADUALLY: Calculate an instability factor based on missing battery
            // Battery at 100% -> factor is 0. Battery at 10% -> factor is 0.9 (9x standard flickering)
            let radiationInstability = (100 - torchBattery) / 10;
            
            // Generate standard noise, then scale it directly by our dynamic instability multiplier
            let baseNoise = Math.sin(Date.now() * 0.08) * 3 * Math.random();
            let flickerNoise = baseNoise * (1 + radiationInstability);

			// Force final radius to 0 immediately if blackout is active OR battery is dead
            let finalRadius = 0;
            if (torchBattery > 0 && blackoutTimer === 0) {
                finalRadius = Math.max(0, baseRadius + flickerNoise);
            }
	
			// Draw Player - Only visible if there is juice and it hasn't shorted out
            if (torchBattery > 0 && blackoutTimer === 0) {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 12, 0, Math.PI * 2);
                ctx.fill();
				
				// Render batteries right along with the player inside the light cone, passing finalRadius parameter
                BatteryModule.renderAll(finalRadius);
				
				// FIX: Paint the glowing radioactive dust specs inside the beam path
                FogParticleModule.renderAll(finalRadius);
            }
			
			 // A. Dynamically instantiate an in-memory, offscreen buffer canvas sheet matching screen resolution pixels
            let shadowCanvas = document.createElement('canvas');
            shadowCanvas.width = canvas.width;
            shadowCanvas.height = canvas.height;
            let sCtx = shadowCanvas.getContext('2d');

            // B. Fill the hidden offscreen buffer canvas with pure dark shadow paint layer completely
            sCtx.fillStyle = "rgba(5, 5, 5, 0.98)";
            sCtx.fillRect(0, 0, shadowCanvas.width, shadowCanvas.height);
			
            // Cutout the flashlight sight hole if light is emitting
			// 3. SWITCH TO ERASER MODE (Erases black pixels to create the light beam)
            if (finalRadius > 0) {
                //ctx.arc(player.x, player.y, finalRadius, 0, Math.PI * 2, true); 
				sCtx.globalCompositeOperation = 'destination-out';
				// Call module to carve the directional flashlight wedge out of the black sheet
                sCtx.fillStyle = "rgba(0,0,0,1)"; // Opaque value indicates full erasure depth
				TorchDirectionModule.clipTorchCone(sCtx,finalRadius);
            }
            //ctx.clip();

            // D. Safe stamp layer injection: Draw the finished dark mask window layer over the main screen viewport
            ctx.save();
            ctx.drawImage(shadowCanvas, 0, 0);
            
			// 1. FIRST CLOSE OUT THE CLIPPING AREA BARRIER
			ctx.restore();

            // Draw UI Stats Texts
			// FIX: Explicitly enforce left alignment so the text never leaks or clips
			ctx.textAlign = 'left';
            ctx.fillStyle = torchBattery < 25 ? '#ff3333' : '#ffcc00';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`🔋Battery: ${Math.ceil(torchBattery)}%`, 12, 24);
            
			if (torchBattery <= 0) {
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("BATTERY DEAD - LOST IN DARKNESS", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#888';
				// Smoothly swap instructions depending on if they are on a phone or laptop!
				let hintText = IS_MOBILE ? "Tap Screen to Restart" : "Press 'R' to Restart";
				ctx.fillText(hintText, canvas.width / 2, canvas.height / 2 + 30);				
            }

            // 3. DRAW VICTORY WIN STATE SCREEN OVERLAY
            if (isGameOver && torchBattery > 0) {
                // FIX: Use a 100% solid, opaque black color block instead of a translucent alpha value.
                // This creates an impenetrable cover layer that completely hides the gameworld underneath.
                ctx.fillStyle = "#111";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00ff66';
                ctx.font = 'bold 50px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("RADIATION ESCAPED!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = 'bold 22px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText("You exited Chernobyl safely", canvas.width / 2, canvas.height / 2 + 30);

                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#ffcc00';
				let hintText = IS_MOBILE ? "Tap Screen to Play Again" : "Press 'R' to Play Again";
                ctx.fillText(hintText, canvas.width / 2, canvas.height / 2 + 80);
            }
			
			// 3. DRAW VIRTUAL JOYSTICK PAD OVERLAY (Safely outside the mask layer)
            if (touchStart && touchMove) {
                ctx.save();
                
                // Outer ring stabilizer anchor base
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(touchStart.x, touchStart.y, 45, 0, Math.PI * 2);
                ctx.stroke();

                // Inner dynamic moving thumb stick handle node
                let dx = touchMove.x - touchStart.x;
                let dy = touchMove.y - touchStart.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let maxDist = 45;

                // Clamp stick layout handle inside bounds
                let stickX = touchStart.x + (dist > maxDist ? (dx / dist) * maxDist : dx);
                let stickY = touchStart.y + (dist > maxDist ? (dy / dist) * maxDist : dy);

                ctx.fillStyle = "rgba(255, 204, 0, 0.4)";
                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
			
			// FIX 3: Close out the translation state map at the absolute end of the frame draw routine
            ScreenShakeModule.postRender();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
		
		// Wipes old game variables and constructs a completely fresh level map layout
        function resetGameEngine() {
            // Re-initialize clear map container grids
            for (let r = 0; r < ROWS; r++) {
                map[r] = [];
                for (let c = 0; c < COLS; c++) {
                    map[r][c] = 1;
                }
            }
            
            // Build a completely new procedural map layout routing matrix
            generateRandomMaze();
            
            // Refill stats parameters
            player.x = TILE_WIDTH * 1.5;
            player.y = TILE_HEIGHT * 1.5;
            torchBattery = 100;
            blackoutTimer = 0;
            nextBlackoutRoll = 0;
            isGameOver = false;
            keys = {}; // Reset pressed key cache state to prevent drift
			
			// Automatically spawn 4 random batteries when a new level maze maps is generated
            BatteryModule.spawnAll(4);
			
			// Recalculate particle spreads to match the current screen boundaries
            FogParticleModule.init();
        }
		
		// 🔋 STANDALONE CHERNOBYL BATTERY REFUELLING MODULE
        const BatteryModule = {
            list: [], // Holds active battery items {x: gridX, y: gridY, active: true}

            // Spawns a set number of batteries across open pathway corridors (0s)
            spawnAll(count = 4) {
                this.list = [];
                let safetyCounter = 0;

                while (this.list.length < count && safetyCounter < 500) {
                    safetyCounter++;
                    // Select a completely random grid coordinate row and column position
                    let rx = Math.floor(Math.random() * COLS);
                    let ry = Math.floor(Math.random() * ROWS);

                    // Ensure the slot is a walkable path (0) and NOT the starting tile or the exit tile
                    if (map[ry] && map[ry][rx] === 0) {
                        if ((rx === 1 && ry === 1) || (rx === COLS - 2 && ry === ROWS - 2)) continue;

                        // Check if an item already exists at this exact coordinate
                        let exists = this.list.some(b => b.x === rx && b.y === ry);
                        if (!exists) {
                            this.list.push({ x: rx, y: ry, active: true });
                        }
                    }
                }
            },

            // Monitors if the player collides with an active battery pack
            checkCollisions() {
                if (isGameOver || torchBattery <= 0) return;

                // Convert player's pixel position into a grid coordinate lookup index
                let playerGridX = Math.floor(player.x / TILE_WIDTH);
                let playerGridY = Math.floor(player.y / TILE_HEIGHT);

                this.list.forEach(battery => {
                    if (battery.active && battery.x === playerGridX && battery.y === playerGridY) {
                        battery.active = false; // Consume item
                        
                        // Refuel the flashlight battery capacity, capping it strictly at 100%
                        torchBattery = Math.min(100, torchBattery + 35);
                    }
                });
            },

            // Draws the batteries ONLY if they sit within the player's illuminated torch circle
            renderAll(finalTorchRadius) {
                this.list.forEach(b => {
                    if (!b.active) return;

                    // Convert grid cells back into physical render coordinates
                    let px = b.x * TILE_WIDTH + TILE_WIDTH / 2;
                    let py = b.y * TILE_HEIGHT + TILE_HEIGHT / 2;

                    // Calculate the exact distance between the player's center point and the battery item
                    let dx = px - player.x;
                    let dy = py - player.y;
                    let distanceToPlayer = Math.sqrt(dx * dx + dy * dy);

                    // FIX: Visually hide the item if it sits outside the active flashlight beam radius
                    // We add a -10 pixel buffer margin so items don't awkwardly display on the pitch-black border line
                    if (distanceToPlayer < finalTorchRadius - 10) {
                        ctx.save();
                        
                        // Draw a glowing neon-cyan radioactive battery cell graphic
                        ctx.fillStyle = '#00ffff';
                        ctx.shadowColor = '#00ffff';
                        ctx.shadowBlur = 10; // Adds an eerie, luminous glowing effect

                        // Establish dynamic sizing boundaries relative to current grid tiles
                        let w = TILE_WIDTH * 0.35;   // Main body width
                        let h = TILE_HEIGHT * 0.50;  // Main body height
                        
                        // DRAW FIX: Paint a vertical cylinder battery cylinder silhouette
                        // 1. Draw the main battery body cylinder frame (Centered)
                        ctx.fillRect(px - w / 2, py - h / 2, w, h);
                        
                        // 2. Draw the small positive contact terminal cap right on top
                        let capW = w * 0.4;
                        let capH = h * 0.15;
                        ctx.fillRect(px - capW / 2, (py - h / 2) - capH, capW, capH);
                        
                        ctx.restore();
                    }
                });
            }
        };
		
		// 🎨 STANDALONE PROCEDURAL TILEMAP TEXTURE ENGINE
        const TextureModule = {
            canvases: {}, // Stores the generated image bitmaps in memory

            // Creates professional textures using fast code loop arrays right at startup
            init() {
                this.canvases.wall = this.createPattern(40, (fctx) => {
                    // Base dark industrial concrete block color
                    fctx.fillStyle = '#2c2c2c';
                    fctx.fillRect(0, 0, 40, 40);
                    // Rusted iron overlay patches
                    fctx.fillStyle = '#664b33';
                    for (let i = 0; i < 6; i++) {
                        fctx.fillRect(Math.random()*30, Math.random()*30, 8+Math.random()*6, 8+Math.random()*6);
                    }
                    // Concrete panel lines and rivets
                    fctx.strokeStyle = '#1a1a1a';
                    fctx.lineWidth = 2;
                    fctx.strokeRect(1, 1, 38, 38);
                    fctx.fillStyle = '#111';
                    fctx.fillRect(4, 4, 3, 3); fctx.fillRect(33, 4, 3, 3);
                    fctx.fillRect(4, 33, 3, 3); fctx.fillRect(33, 33, 3, 3);
                });

                this.canvases.exit = this.createPattern(40, (fctx) => {
                    // High-contrast warning stripes for the radioactive extraction zone
                    fctx.fillStyle = '#111111';
                    fctx.fillRect(0, 0, 40, 40);
                    fctx.fillStyle = '#00ff66';
                    fctx.lineWidth = 6;
                    fctx.beginPath();
                    for (let i = -40; i < 80; i += 16) {
                        fctx.moveTo(i, -10);
                        fctx.lineTo(i + 40, 50);
                    }
                    fctx.strokeStyle = '#00ff66';
                    fctx.stroke();
                });
            },

            // Helper function that compiles raw shape math into ultra-fast browser patterns
            createPattern(size, drawFunc) {
                let pCanvas = document.createElement('canvas');
                pCanvas.width = size;
                pCanvas.height = size;
                drawFunc(pCanvas.getContext('2d'));
                return pCanvas;
            },

            // Renders textures perfectly scaled to fit your dynamic screen tiles
            drawTile(type, x, y, width, height) {
                let img = this.canvases[type];
                if (img) {
                    // Draws the cached textured bitmap stretching it cleanly to your dynamic resolution pixels
                    ctx.drawImage(img, x, y, width, height);
                }
            }
        };

        // Fire up the texture cache compilation immediately on layout configuration script boot
        TextureModule.init();
		
		// 🫨 STANDALONE SCREEN SHAKE MODULE
        const ScreenShakeModule = {
            intensity: 0, // Current pixel movement offset scale
            decay: 0.90,  // How quickly the shaking dampens down per frame

            // Triggers a violent camera hit
            trigger(force = 15) {
                this.intensity = force;
            },

            // Applies the rumble matrix displacement directly to the canvas viewport context
            preRender() {
                if (this.intensity < 0.1) {
                    this.intensity = 0;
                    return;
                }

                // Calculate random micro-displacements along X and Y axes based on active force intensity
                let shakeX = (Math.random() * 2 - 1) * this.intensity;
                let shakeY = (Math.random() * 2 - 1) * this.intensity;

                ctx.save();
                // Shift the entire canvas matrix positioning coordinates
                ctx.translate(shakeX, shakeY);

                // Dwindle the shake force smoothly for the next frame render cycle
                this.intensity *= this.decay;
            },

            // Safely closes out the canvas translation state map
            postRender() {
                // If a canvas translation displacement was applied, restore context parameters to grid zero
                if (this.intensity > 0) {
                    ctx.restore();
                }
            }
        };
		
		// ⚛️ STANDALONE RADIATION FOG PARTICLE MODULE
        const FogParticleModule = {
            particles: [],
            maxParticles: 345, // Number of toxic dust motes on screen

            // Populates random dust vectors across the screen coordinates at startup
            init() {
                this.particles = [];
                for (let i = 0; i < this.maxParticles; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.width, // Extra boundary buffer
                        size: 1 + Math.random() * 2.5,
                        speedX: (Math.random() * 0.4 - 0.2), // Slow weaving wind speeds
                        speedY: -(0.1 + Math.random() * 0.3), // Float slowly upwards
                        alphaAngle: Math.random() * Math.PI // Used for organic pulsing fades
                    });
                }
            },

            // Updates particle positions and respawns them if they drift off screen
            updateAll() {
                if (isGameOver) return;

                this.particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.alphaAngle += 0.02; // Cycle pulsing transparency loop

                    // If a particle floats off the top, cycle it back to the bottom window margin
                    if (p.y < -10) {
                        p.y = canvas.height + 10;
                        p.x = Math.random() * canvas.width;
                    }
                    // Handle side edge screen loops
                    if (p.x < -10) p.x = canvas.width + 10;
                    if (p.x > canvas.width + 10) p.x = -10;
                });
            },

            // Renders fog motes ONLY if they reside within the player's current light cone radius
            renderAll(finalTorchRadius) {
                if (torchBattery <= 0 || blackoutTimer > 0) return;

                this.particles.forEach(p => {
                    // Calculate exact pixel distance between player center and this fog particle
                    let dx = p.x - player.x;
                    let dy = p.y - player.y;
                    let distanceToPlayer = Math.sqrt(dx * dx + dy * dy);

                    // FIX: Draw particles only if they sit inside the active flashlight beam area
                    if (distanceToPlayer < finalTorchRadius - 5) {
                        ctx.save();
                        
                        // Create a floating, breathing, luminous neon green transparency overlay
                        let breathingAlpha = 0.15 + Math.sin(p.alphaAngle) * 0.1;
                        ctx.fillStyle = `rgba(57, 255, 20, ${Math.max(0.05, breathingAlpha)})`;
                        
                        // Subtle radioactive bloom glow effect
                        ctx.shadowColor = '#00ff66';
                        ctx.shadowBlur = 6;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.restore();
                    }
                });
            }
        };

        // Initialize particle configurations immediately on engine execution
        FogParticleModule.init();
		
		// 🔦 STANDALONE DYNAMIC TORCH DIRECTIONALITY MODULE
        const TorchDirectionModule = {
            currentAngle: 0, // In radians
            targetAngle: 0,  // Angle player is trying to face
            lerpSpeed: 0.12,  // Controls smoothness of the torch pan swivel turning speed
            beamConeWidth: Math.PI / 3, // 90-degree light cone span width (PI/2 radians)

            // Calculates the facing angle based on the player's current speed vectors
            updateDirection(moveX, moveY) {
                if (isGameOver) return;

                // Only update the target direction if the player is actively pushing inputs
                if (moveX !== 0 || moveY !== 0) {
                    this.targetAngle = Math.atan2(moveY, moveX);
                }

                // Smoothly slide current angle toward target angle (Handles circle radian wrap checking)
                let diff = this.targetAngle - this.currentAngle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                
                this.currentAngle += diff * this.lerpSpeed;
            },

			// Carves out a high-visibility, 90-degree directional flashlight cone mask on a targeted context layer
            clipTorchCone(targetCtx, finalRadius) {
                let startAngle = this.currentAngle - (this.beamConeWidth / 2);
                let endAngle = this.currentAngle + (this.beamConeWidth / 2);

                // Build a perfect wedge path using standard drawing tools on the target buffer context parameter
                targetCtx.beginPath();
                targetCtx.moveTo(player.x, player.y);
                targetCtx.arc(player.x, player.y, finalRadius, startAngle, endAngle, false);
                targetCtx.closePath();
                targetCtx.fill();
            }
        };
		
        gameLoop();
		
    </script>
